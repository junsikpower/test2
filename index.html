<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>뽀모도로 타이머</title>
<style>
  :root {
    --bg: #1c1f26;
    --panel: #262b36;
    --accent: #ff6b6b;
    --accent-break: #4dabf7;
    --text: #f1f3f5;
    --muted: #9aa4b2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  #app { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.1rem; letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase; }
  .banner {
    background: #7a3030; color: #ffe3e3; border: 1px solid var(--accent);
    padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem;
  }
  nav { display: flex; gap: 8px; margin-bottom: 24px; }
  nav button {
    flex: 1; background: var(--panel); color: var(--text); border: 1px solid #333a47;
    padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
  }
  nav button[aria-current="page"] { border-color: var(--accent); color: var(--accent); }
  .card { background: var(--panel); border-radius: 14px; padding: 28px 20px; text-align: center; }
  .session-type { font-size: 1rem; color: var(--muted); margin-bottom: 6px; }
  .slot-info { font-size: 0.8rem; color: var(--muted); margin-bottom: 18px; }
  .clock { font-size: 4rem; font-variant-numeric: tabular-nums; font-weight: 700; margin: 8px 0 24px; }
  .controls { display: flex; gap: 10px; justify-content: center; }
  .controls button, .memo-box button, .settings button {
    background: var(--accent); color: #1c1f26; border: none; padding: 12px 18px;
    border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  .controls button.secondary, .memo-box button.secondary {
    background: transparent; color: var(--text); border: 1px solid #333a47;
  }
  .memo-box { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .memo-box input, .settings input {
    background: #1c1f26; border: 1px solid #333a47; color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 0.95rem;
  }
  .settings label { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; gap: 12px; }
  .settings input { width: 100px; text-align: right; }
  .error { color: var(--accent); font-size: 0.9rem; margin-top: 8px; }
  ul#log-list { list-style: none; padding: 0; text-align: left; }
  ul#log-list li { padding: 8px 0; border-bottom: 1px solid #333a47; font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  .icon { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
</style>
</head>
<body>
<main id="app">
  <h1>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="13" r="8" /><path d="M12 13V9" /><path d="M9 2h6" />
    </svg>
    뽀모도로 타이머 &amp; 작업 기록
  </h1>

  <div id="storage-banner" class="banner" role="alert" hidden></div>

  <nav>
    <button id="nav-timer" type="button" aria-current="page">타이머</button>
    <button id="nav-settings" type="button" aria-current="false">설정</button>
    <button id="nav-log" type="button" aria-current="false">로그</button>
  </nav>

  <section id="view-timer" class="card">
    <div id="session-type" class="session-type">집중</div>
    <div id="slot-info" class="slot-info">사이클 0 / 4</div>
    <div id="clock" class="clock">25:00</div>

    <div id="timer-controls" class="controls">
      <button id="btn-start-pause" type="button">시작</button>
      <button id="btn-reset" type="button" class="secondary">리셋</button>
      <button id="btn-skip" type="button" class="secondary">건너뛰기</button>
    </div>

    <div id="memo-box" class="memo-box" hidden>
      <label for="memo-input">이번 집중 세션에서 한 작업 (한 줄)</label>
      <input id="memo-input" type="text" maxlength="200" placeholder="예: PRD 3장 검토" />
      <div class="controls">
        <button id="btn-memo-submit" type="button">메모 저장</button>
        <button id="btn-memo-skip" type="button" class="secondary">건너뛰기</button>
      </div>
    </div>
  </section>

  <section id="view-settings" class="card settings" hidden>
    <label>집중 시간(분)<input id="set-focus" type="number" min="1" max="180" step="1" value="25" /></label>
    <label>짧은 휴식(분)<input id="set-short" type="number" min="1" max="180" step="1" value="5" /></label>
    <label>긴 휴식(분)<input id="set-long" type="number" min="1" max="180" step="1" value="15" /></label>
    <button id="btn-settings-save" type="button">저장</button>
    <div id="settings-error" class="error" hidden></div>
  </section>

  <section id="view-log" class="card" hidden>
    <label>날짜 <input id="log-date" type="date" /></label>
    <p>완료한 뽀모도로: <strong id="log-count">0</strong></p>
    <ul id="log-list"></ul>
  </section>
</main>

<script>
/* 생성된 파일 — 편집하지 마세요. 원본: src/*.js, index.template.html */
(function () {
  "use strict";
  var module; // UMD 의 CommonJS 분기를 브라우저에서 비활성화
  /* ==== src/core.js ==== */
/*
 * core.js — 뽀모도로 타이머 겸 작업 기록 웹앱의 순수 로직 계층
 *
 * PRD v4 기준. DOM / localStorage / Audio / Notification 등 브라우저 부수효과는
 * 이 파일에 두지 않는다. 시간 관련 값(now = Date.now(), perfNow = performance.now())은
 * 전역을 직접 호출하지 않고 항상 인자로 주입받아 테스트 가능하도록 한다.
 *
 * 12.2 승인된 기술 결정:
 *  - 타이머 계산은 endTimestamp(절대 종료 시각) 기준 (setInterval 카운트다운 아님)
 *  - 시계 변경 감지는 dateAnchor/perfAnchor 델타 비교, 임계값 5초 (대체 불가 — 12.3)
 *  - Focus 슬롯은 완료/스킵과 무관하게 소모(슬롯 소모형), 4슬롯 소모 시 Long Break
 *  - 리셋은 현재 세션 타이머만 초기화, 슬롯 카운트 유지 (BR-03)
 *  - 재접속 복원 시 다음 세션 자동 시작 안 함, Idle 대기 (BR-02)
 *  - 오프라인 중 다중 세션 만료 → 1회만 종료 처리
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.PomodoroCore = factory();
  }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var SESSION = { FOCUS: 'Focus', SHORT_BREAK: 'ShortBreak', LONG_BREAK: 'LongBreak' };
  var STATUS = { IDLE: 'Idle', RUNNING: 'Running', PAUSED: 'Paused' };

  var DEFAULT_SETTINGS = { focusMin: 25, shortBreakMin: 5, longBreakMin: 15 };
  var SETTINGS_MIN = 1;
  var SETTINGS_MAX = 180;

  // BR-01: 사이클당 Focus 슬롯 4개. 4번째 슬롯 소모 시 Long Break.
  var FOCUS_SLOTS_PER_CYCLE = 4;

  // EC-04 / NFR-01: 시스템 시계 변경 판정 임계값 (밀리초).
  var CLOCK_CHANGE_THRESHOLD_MS = 5000;

  var MS_PER_MIN = 60 * 1000;
  // 6.3 TimerState: Paused 남은 시간 스냅샷은 정의상 항상 1초 이상의 양수.
  var MIN_PAUSED_REMAINING_MS = 1000;

  function isBreak(type) {
    return type === SESSION.SHORT_BREAK || type === SESSION.LONG_BREAK;
  }

  function assertKnownSession(type) {
    if (type !== SESSION.FOCUS && type !== SESSION.SHORT_BREAK && type !== SESSION.LONG_BREAK) {
      throw new Error('Unknown session type: ' + String(type));
    }
  }

  // ── Settings ────────────────────────────────────────────────────────────────

  function cloneSettings(s) {
    return { focusMin: s.focusMin, shortBreakMin: s.shortBreakMin, longBreakMin: s.longBreakMin };
  }

  function defaultSettings() {
    return cloneSettings(DEFAULT_SETTINGS);
  }

  // FR-07: 1~180분 정수만 허용. 범위 초과 / 소수 / 비숫자는 거부.
  function validateSettingsField(raw) {
    if (typeof raw === 'number') {
      if (!isFinite(raw)) return { valid: false };
      if (Math.floor(raw) !== raw) return { valid: false };
      if (raw < SETTINGS_MIN || raw > SETTINGS_MAX) return { valid: false };
      return { valid: true, value: raw };
    }
    if (typeof raw === 'string') {
      var trimmed = raw.trim();
      if (trimmed === '') return { valid: false };
      // 정수 문자열만 허용 (소수점, 지수, 부호 표기, 공백 포함 문자열 거부).
      if (!/^\d+$/.test(trimmed)) return { valid: false };
      var n = Number(trimmed);
      if (n < SETTINGS_MIN || n > SETTINGS_MAX) return { valid: false };
      return { valid: true, value: n };
    }
    return { valid: false };
  }

  // FR-07: 세 필드 전부 유효해야 저장 가능. 하나라도 실패하면 저장 차단 + 오류.
  function validateSettings(input) {
    input = input || {};
    var fields = ['focusMin', 'shortBreakMin', 'longBreakMin'];
    var errors = {};
    var value = {};
    var valid = true;
    for (var i = 0; i < fields.length; i++) {
      var key = fields[i];
      var res = validateSettingsField(input[key]);
      if (res.valid) {
        value[key] = res.value;
      } else {
        valid = false;
        errors[key] = true;
      }
    }
    return valid ? { valid: true, value: value } : { valid: false, errors: errors };
  }

  function sessionLengthMs(type, settings) {
    assertKnownSession(type);
    if (type === SESSION.FOCUS) return settings.focusMin * MS_PER_MIN;
    if (type === SESSION.SHORT_BREAK) return settings.shortBreakMin * MS_PER_MIN;
    return settings.longBreakMin * MS_PER_MIN;
  }

  // ── Anchors (EC-04) ─────────────────────────────────────────────────────────

  function sampleAnchor(now, perfNow) {
    return { dateAnchor: now, perfAnchor: perfNow };
  }

  // EC-04: |dateDelta - perfDelta| >= 5초 이면 시스템 시계 변경으로 판정.
  // 원시 값이 아니라 앵커 대비 델타끼리 비교한다.
  function detectClockChange(anchor, now, perfNow) {
    if (!anchor || typeof anchor.dateAnchor !== 'number' || typeof anchor.perfAnchor !== 'number') {
      return false;
    }
    var dateDelta = now - anchor.dateAnchor;
    var perfDelta = perfNow - anchor.perfAnchor;
    return Math.abs(dateDelta - perfDelta) >= CLOCK_CHANGE_THRESHOLD_MS;
  }

  // ── TimerState 생성/전이 ────────────────────────────────────────────────────

  function createInitialTimer(settings, now, perfNow) {
    return {
      sessionType: SESSION.FOCUS,
      status: STATUS.IDLE,
      endTimestamp: null,
      remainingMsSnapshot: sessionLengthMs(SESSION.FOCUS, settings),
      focusSlotsConsumed: 0,
      dateAnchor: now,
      perfAnchor: perfNow,
      // Memo-Input-Pending (6.2): 기저 status 는 Idle. UI 오버레이 플래그로만 표현.
      memoPending: false,
      pendingCompletion: null,
      // 이 memoPending 이 재접속 복원(EC-03)에서 비롯됐는지 여부.
      // true 면 메모 해소 후 다음 세션을 자동 시작하지 않고 Idle 로 대기한다(BR-02).
      restoredPending: false
    };
  }

  function copyTimer(t) {
    return {
      sessionType: t.sessionType,
      status: t.status,
      endTimestamp: t.endTimestamp,
      remainingMsSnapshot: t.remainingMsSnapshot,
      focusSlotsConsumed: t.focusSlotsConsumed,
      dateAnchor: t.dateAnchor,
      perfAnchor: t.perfAnchor,
      memoPending: !!t.memoPending,
      pendingCompletion: t.pendingCompletion || null,
      restoredPending: !!t.restoredPending
    };
  }

  // 현재 세션에서 "표시해야 하는" 남은 시간(ms).
  //  - Idle: 설정된 세션 길이 (FR-07: Idle 세션은 설정 변경이 즉시 반영됨)
  //  - Running: endTimestamp - now (0 밑으로 내려가지 않음)
  //  - Paused: 저장된 스냅샷 (오프라인 시간과 무관)
  function remainingMs(timer, now, settings) {
    if (timer.status === STATUS.RUNNING) {
      return Math.max(0, timer.endTimestamp - now);
    }
    if (timer.status === STATUS.PAUSED) {
      return timer.remainingMsSnapshot;
    }
    // Idle
    return sessionLengthMs(timer.sessionType, settings);
  }

  function isExpired(timer, now) {
    return timer.status === STATUS.RUNNING && now >= timer.endTimestamp;
  }

  // FR-01 시작: endTimestamp = now + 남은시간. Idle 이면 설정 길이, Paused 면 스냅샷 이어받기.
  function startTimer(timer, settings, now, perfNow) {
    if (timer.memoPending) {
      throw new Error('Cannot start timer while memo input is pending (BR-04)');
    }
    if (timer.status === STATUS.RUNNING) {
      return copyTimer(timer);
    }
    var base = timer.status === STATUS.PAUSED
      ? timer.remainingMsSnapshot
      : sessionLengthMs(timer.sessionType, settings);
    var next = copyTimer(timer);
    next.status = STATUS.RUNNING;
    next.endTimestamp = now + base;
    next.remainingMsSnapshot = base;
    next.dateAnchor = now;
    next.perfAnchor = perfNow;
    return next;
  }

  // FR-01 일시정지: 남은 시간을 고정 저장, endTimestamp 제거.
  function pauseTimer(timer, now) {
    if (timer.status !== STATUS.RUNNING) {
      return copyTimer(timer);
    }
    var remaining = Math.max(MIN_PAUSED_REMAINING_MS, timer.endTimestamp - now);
    var next = copyTimer(timer);
    next.status = STATUS.PAUSED;
    next.remainingMsSnapshot = remaining;
    next.endTimestamp = null;
    return next;
  }

  // EC-04 재개: 현재 시각 기준 새 endTimestamp 계산 + 앵커 재설정 후 Running.
  function resumeTimer(timer, now, perfNow) {
    if (timer.status !== STATUS.PAUSED) {
      return copyTimer(timer);
    }
    var next = copyTimer(timer);
    next.status = STATUS.RUNNING;
    next.endTimestamp = now + timer.remainingMsSnapshot;
    next.dateAnchor = now;
    next.perfAnchor = perfNow;
    return next;
  }

  // FR-01 / BR-03 리셋: 현재 세션 타이머만 설정 길이의 Idle 로. 슬롯 수는 불변.
  function resetTimer(timer, settings) {
    if (timer.memoPending) {
      throw new Error('Cannot reset timer while memo input is pending (BR-04)');
    }
    var next = copyTimer(timer);
    next.status = STATUS.IDLE;
    next.endTimestamp = null;
    next.remainingMsSnapshot = sessionLengthMs(timer.sessionType, settings);
    // focusSlotsConsumed 유지 (BR-03)
    return next;
  }

  // EC-04: 시계 변경 감지 시 즉시 Paused. 남은 시간은 마지막 유효 계산값으로 고정.
  function forcePauseForClockChange(timer, lastValidRemainingMs) {
    if (timer.status !== STATUS.RUNNING) {
      return copyTimer(timer);
    }
    var remaining = Math.max(MIN_PAUSED_REMAINING_MS, Math.round(lastValidRemainingMs));
    var next = copyTimer(timer);
    next.status = STATUS.PAUSED;
    next.remainingMsSnapshot = remaining;
    next.endTimestamp = null;
    return next;
  }

  // ── 사이클 전이 (BR-01) ─────────────────────────────────────────────────────

  // 방금 끝난(또는 스킵된) 세션 타입과 그 시점의 소모 슬롯 수를 받아
  // 다음 세션 타입 + 다음 소모 슬롯 수를 계산한다.
  //  - Focus 종료/스킵: 슬롯 1 소모. 소모 후 4 이면 Long Break, 아니면 Short Break.
  //  - Short/Long Break 종료/스킵: 다음은 Focus.
  //  - Long Break 이후(스킵 포함): 사이클 초기화 → 슬롯 0 으로.
  function advanceCycle(endedType, focusSlotsConsumed) {
    assertKnownSession(endedType);
    if (endedType === SESSION.FOCUS) {
      var consumed = Math.min(FOCUS_SLOTS_PER_CYCLE, focusSlotsConsumed + 1);
      if (consumed >= FOCUS_SLOTS_PER_CYCLE) {
        return { sessionType: SESSION.LONG_BREAK, focusSlotsConsumed: consumed };
      }
      return { sessionType: SESSION.SHORT_BREAK, focusSlotsConsumed: consumed };
    }
    if (endedType === SESSION.LONG_BREAK) {
      return { sessionType: SESSION.FOCUS, focusSlotsConsumed: 0 };
    }
    // Short Break
    return { sessionType: SESSION.FOCUS, focusSlotsConsumed: focusSlotsConsumed };
  }

  function makeIdleTimer(prevTimer, sessionType, focusSlotsConsumed, settings, now, perfNow) {
    return {
      sessionType: sessionType,
      status: STATUS.IDLE,
      endTimestamp: null,
      remainingMsSnapshot: sessionLengthMs(sessionType, settings),
      focusSlotsConsumed: focusSlotsConsumed,
      dateAnchor: now,
      perfAnchor: perfNow,
      memoPending: false,
      pendingCompletion: null,
      restoredPending: false
    };
  }

  function makeRunningTimer(sessionType, focusSlotsConsumed, settings, now, perfNow) {
    var len = sessionLengthMs(sessionType, settings);
    return {
      sessionType: sessionType,
      status: STATUS.RUNNING,
      endTimestamp: now + len,
      remainingMsSnapshot: len,
      focusSlotsConsumed: focusSlotsConsumed,
      dateAnchor: now,
      perfAnchor: perfNow,
      memoPending: false,
      pendingCompletion: null,
      restoredPending: false
    };
  }

  // 로컬 타임존 기준 날짜 키 (YYYY-MM-DD). FR-06 / FR-08: 모든 시각은 기기 로컬 타임존.
  function dateKey(timestamp) {
    var d = new Date(timestamp);
    var y = d.getFullYear();
    var m = d.getMonth() + 1;
    var day = d.getDate();
    return y + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  }

  // ── 세션 종료 처리 (실시간 포그라운드) ─────────────────────────────────────

  // FR-02/FR-03/FR-05: 진행 중 세션이 정상 종료(시간 만료)됐을 때.
  //  - Focus: 완료 카운트 +1 → Memo-Input-Pending (다음 세션 미시작, BR-04)
  //  - Break: 메모 없이 곧바로 다음 Focus 자동 시작 (BR-02: 포그라운드 한정)
  // 반환:
  //  {
  //    timer,                // 다음 상태
  //    notify: true,         // 항상 (FR-02) — 알림/소리 트리거
  //    memoPending: bool,    // Focus 만료 시 true
  //    completion: null | { dateKey, completedAt }  // Focus 만료 시 (완료 카운트 귀속)
  //    autoStarted: bool     // Break 만료 시 true
  //  }
  function completeExpiredSession(timer, settings, now, perfNow) {
    if (timer.status !== STATUS.RUNNING) {
      throw new Error('completeExpiredSession requires a Running timer');
    }
    var endTs = timer.endTimestamp;

    if (timer.sessionType === SESSION.FOCUS) {
      // Focus 슬롯 소모는 유일하게 advanceCycle 에서만 일어난다(여기서 미리 증가시키지 않는다).
      // 메모 제출/건너뛰기(resolveMemoAndAdvance) 시점에 BR-01 순서에 따라 1회 소모된다.
      var pendingTimer = {
        sessionType: SESSION.FOCUS,
        status: STATUS.IDLE,
        endTimestamp: null,
        remainingMsSnapshot: 0,
        focusSlotsConsumed: timer.focusSlotsConsumed,
        dateAnchor: now,
        perfAnchor: perfNow,
        memoPending: true,
        pendingCompletion: { dateKey: dateKey(endTs), completedAt: endTs },
        restoredPending: false
      };
      return {
        timer: pendingTimer,
        notify: true,
        memoPending: true,
        completion: { dateKey: dateKey(endTs), completedAt: endTs },
        autoStarted: false
      };
    }

    // Break 종료 → 다음 Focus 자동 시작
    var adv = advanceCycle(timer.sessionType, timer.focusSlotsConsumed);
    return {
      timer: makeRunningTimer(adv.sessionType, adv.focusSlotsConsumed, settings, now, perfNow),

    try {
      var r = win.Notification.requestPermission();
      if (r && typeof r.then === 'function') return r;
      return Promise.resolve(r);
    } catch (e) {
      return Promise.resolve('denied');
    }
  }

  // ── 앱 컨트롤러 ───────────────────────────────────────────────────────────
  function createApp(opts) {
    opts = opts || {};
    var doc = opts.document || (typeof document !== 'undefined' ? document : null);
    var win = opts.window || (typeof window !== 'undefined' ? window : null);
    if (!doc || !win) throw new Error('createApp requires document and window');

    var now = opts.now || nowFn;
    var perfNow = opts.perfNow || perfNowFn;
    var store = opts.storage || Storage.createStore({ backend: opts.backend });
    var beeper = opts.beeper || createBeeper(win);

    var TICK_MS = opts.tickMs || 250;

    var settings = Core.defaultSettings();
    var logs = Core.emptyLogs();
    var timer = Core.createInitialTimer(settings, now(), perfNow());
    var logViewDate = Core.dateKey(now());
    var view = 'timer'; // 'timer' | 'settings' | 'log'
    var tickHandle = null;
    var originalTitle = doc.title || '뽀모도로 타이머';
    var titleFallbackActive = false;
    var lastValidRemainingMs = null;

    var els = {};
    function $(id) { return doc.getElementById(id); }

    function persistAll() {
      store.write('settings', settings);
      store.write('logs', logs);
      store.write('timer', timer);
    }
    function persistTimer() { store.write('timer', timer); }
    function persistLogs() { store.write('logs', logs); }

    // ── 알림 (FR-02 / EC-01) ────────────────────────────────────────────────
    function fireNotification(message) {
      var soundPromise = beeper.play();
      var usedDesktop = false;
      if (notificationGranted(win)) {
        try {
          new win.Notification('뽀모도로', { body: message });
          usedDesktop = true;
        } catch (e) { usedDesktop = false; }
      }
      soundPromise.then(function (ok) {
        if (!ok && !usedDesktop) {
          activateTitleFallback(message);
        } else if (!ok) {
          // 소리 실패는 감지되었으나 데스크톱 알림은 호출됨 → 그래도 탭 제목으로 보강.
          activateTitleFallback(message);
        }
      });
      if (!usedDesktop && !notificationGranted(win)) {
        // 권한 거부/미지원: 소리 + 탭 제목 (EC-01)
        activateTitleFallback(message);
      }
    }

    function activateTitleFallback(message) {
      titleFallbackActive = true;
      doc.title = '● ' + (message || '세션 종료') + ' — ' + originalTitle;
    }
    function clearTitleFallback() {
      if (titleFallbackActive) {
        doc.title = originalTitle;
        titleFallbackActive = false;
      }
    }

    // ── 렌더 ────────────────────────────────────────────────────────────────
    function render() {
      if (!els.root) return;
      renderBanner();
      renderNav();

      els.timerView.hidden = view !== 'timer';
      els.settingsView.hidden = view !== 'settings';
      els.logView.hidden = view !== 'log';

      if (view === 'timer') renderTimer();
      if (view === 'settings') renderSettings();
      if (view === 'log') renderLog();
    }

    function renderBanner() {
      var failed = store.getState() === store.STORE_STATE.WRITE_FAILED;
      els.banner.hidden = !failed;
      els.banner.textContent = failed
        ? '데이터가 저장되지 않고 있습니다 — 새로고침 시 최근 변경사항이 유실될 수 있습니다'
        : '';
    }

    function renderNav() {
      els.navTimer.setAttribute('aria-current', view === 'timer' ? 'page' : 'false');
      els.navSettings.setAttribute('aria-current', view === 'settings' ? 'page' : 'false');
      els.navLog.setAttribute('aria-current', view === 'log' ? 'page' : 'false');
    }

    function renderTimer() {
      var t = now();
      els.sessionType.textContent = sessionLabel(timer.sessionType);
      els.slotInfo.textContent = '사이클 ' + timer.focusSlotsConsumed + ' / ' + Core.FOCUS_SLOTS_PER_CYCLE;
      els.clock.textContent = formatClock(Core.remainingMs(timer, t, settings));

      var showControls = !timer.memoPending;
      els.controls.hidden = !showControls;
      els.memoBox.hidden = !timer.memoPending;

      if (showControls) {
        var running = timer.status === Core.STATUS.RUNNING;
        els.startPauseBtn.textContent = running ? '일시정지' : '시작';
        els.resetBtn.disabled = false;
        els.skipBtn.disabled = false;
      }
    }

    function renderSettings() {
      els.focusInput.value = settings.focusMin;
      els.shortInput.value = settings.shortBreakMin;
      els.longInput.value = settings.longBreakMin;
    }

    function renderLog() {
      var day = Core.getDailyLog(logs, logViewDate);
      els.logDate.value = logViewDate;
      els.logCount.textContent = String(day.count);
      els.logList.innerHTML = '';
      for (var i = 0; i < day.memos.length; i++) {
        var li = doc.createElement('li');
        var time = new Date(day.memos[i].completedAt);
        var hh = time.getHours(); var mm = time.getMinutes();
        var stamp = (hh < 10 ? '0' + hh : hh) + ':' + (mm < 10 ? '0' + mm : mm);
        li.textContent = stamp + '  ' + Core.displayMemoText(day.memos[i].text);
        els.logList.appendChild(li);
      }
    }

    // ── 타이머 동작 ─────────────────────────────────────────────────────────
    function onStartPause() {
      beeper.unlock();
      clearTitleFallback();
      if (timer.memoPending) return;
      if (timer.status === Core.STATUS.RUNNING) {
        timer = Core.pauseTimer(timer, now());
      } else if (timer.status === Core.STATUS.PAUSED) {
        timer = Core.resumeTimer(timer, now(), perfNow());
      } else {
        timer = Core.startTimer(timer, settings, now(), perfNow());
      }
      lastValidRemainingMs = null;
      persistTimer();
      render();
    }

    function onReset() {
      if (timer.memoPending) return;
      timer = Core.resetTimer(timer, settings);
      lastValidRemainingMs = null;
      persistTimer();
      render();
    }

    function onSkip() {
      beeper.unlock();
      if (timer.memoPending) return;
      var res = Core.skipSession(timer, settings, now(), perfNow());
      timer = res.timer;
      lastValidRemainingMs = null;
      persistTimer();
      render();
    }

    function onMemoSubmit() {
      if (!timer.memoPending) return;
      submitMemo(els.memoInput.value);
    }
    function onMemoSkip() {
      if (!timer.memoPending) return;
      submitMemo('');
    }

    function submitMemo(text) {
      var pc = timer.pendingCompletion;
      if (pc) {
        logs = Core.setMemoText(logs, pc.dateKey, pc.completedAt, typeof text === 'string' ? text.trim() : '');
        persistLogs();
      }
      var res = Core.resolveMemoAndAdvance(timer, settings, now(), perfNow());
      timer = res.timer;
      lastValidRemainingMs = null;
      els.memoInput.value = '';
      persistTimer();
      render();
    }

    function onSettingsSave() {
      var result = Core.validateSettings({
        focusMin: els.focusInput.value,
        shortBreakMin: els.shortInput.value,
        longBreakMin: els.longInput.value
      });
      if (!result.valid) {
        els.settingsError.hidden = false;
        els.settingsError.textContent = '각 값은 1~180 사이의 정수여야 합니다.';
        return;
      }
      els.settingsError.hidden = true;
      settings = Core.cloneSettings(result.value);
      // FR-07: Idle 세션이면 화면 표시가 즉시 갱신됨 (remainingMs 가 settings 를 참조).
      //        Running/Paused 세션은 endTimestamp/스냅샷을 건드리지 않으므로 다음 회차부터 반영.
      store.write('settings', settings);
      if (timer.status === Core.STATUS.IDLE && !timer.memoPending) {
        timer.remainingMsSnapshot = Core.sessionLengthMs(timer.sessionType, settings);
        persistTimer();
      }
      render();
    }

    // ── tick / 시계 이상 / 만료 ─────────────────────────────────────────────

    // EC-04: 시계 변경 감지 시 "직전 마지막으로 유효했던 계산값"으로 고정하기 위해,
    // 이상이 없던 매 tick 마다 남은 시간을 기록해 둔다.
    function lastValidRemainingFallback() {
      if (typeof lastValidRemainingMs === 'number' && lastValidRemainingMs > 0) {
        return lastValidRemainingMs;
      }
      var raw = timer.endTimestamp - now();
      if (raw > 0) return raw;
      return timer.remainingMsSnapshot || Core.sessionLengthMs(timer.sessionType, settings);
    }

    function evaluate() {
      if (timer.status === Core.STATUS.RUNNING) {
        // EC-04: 시계 변경 감지
        if (Core.detectClockChange({ dateAnchor: timer.dateAnchor, perfAnchor: timer.perfAnchor }, now(), perfNow())) {
          timer = Core.forcePauseForClockChange(timer, lastValidRemainingFallback());
          lastValidRemainingMs = null;
          persistTimer();
          try { win.alert('시스템 시간 변경이 감지되어 타이머가 일시정지되었습니다'); } catch (e) { /* noop */ }
          render();
          return;
        }
        // 이상 없음 — 마지막 유효 남은시간 갱신
        lastValidRemainingMs = Math.max(0, timer.endTimestamp - now());
        // 만료 → 1회 종료 처리
        if (Core.isExpired(timer, now())) {
          var res = Core.completeExpiredSession(timer, settings, now(), perfNow());
          if (res.completion) {
            logs = Core.addCompletion(logs, res.completion.dateKey, res.completion.completedAt, '');
            persistLogs();
          }
          timer = res.timer;
          lastValidRemainingMs = null;
          persistTimer();
          fireNotification(res.memoPending ? '집중 세션 완료 — 메모를 입력하세요' : '휴식 종료 — 다음 집중을 시작합니다');
          render();
          return;
        }
      }
      render();
    }

    function tick() {
      evaluate();
    }

    function onVisibilityChange() {
      if (doc.visibilityState === 'visible') {
        // EC-02 / EC-04: 탭 복귀 시 앵커 재설정 후 즉시 재계산.
        if (timer.status === Core.STATUS.RUNNING && !Core.isExpired(timer, now()) &&
            !Core.detectClockChange({ dateAnchor: timer.dateAnchor, perfAnchor: timer.perfAnchor }, now(), perfNow())) {
          timer.dateAnchor = now();
          timer.perfAnchor = perfNow();
        }
        evaluate();
      }
    }

    // ── 부트스트랩 ─────────────────────────────────────────────────────────
    function loadPersisted() {
      var savedSettings = store.read('settings', null);
      if (savedSettings) {
        var v = Core.validateSettings(savedSettings);
        settings = v.valid ? Core.cloneSettings(v.value) : Core.defaultSettings();
      }
      var savedLogs = store.read('logs', null);
      if (savedLogs && typeof savedLogs === 'object') logs = savedLogs;

      var savedTimer = store.read('timer', null);
      var restored = Core.restoreTimer(savedTimer, settings, now(), perfNow());
      timer = restored.timer;
      if (restored.expired) {
        if (restored.completion) {
          logs = Core.addCompletion(logs, restored.completion.dateKey, restored.completion.completedAt, '');
          persistLogs();
        }
        fireNotification(restored.memoPending
          ? '집중 세션이 종료되었습니다 — 메모를 입력하세요'
          : '휴식이 종료되었습니다');
      }
      persistTimer();
    }

    function cacheEls() {
      els.root = $('app');
      els.banner = $('storage-banner');
      els.navTimer = $('nav-timer');
      els.navSettings = $('nav-settings');
      els.navLog = $('nav-log');
      els.timerView = $('view-timer');
      els.settingsView = $('view-settings');
      els.logView = $('view-log');
      els.sessionType = $('session-type');
      els.slotInfo = $('slot-info');
      els.clock = $('clock');
      els.controls = $('timer-controls');
      els.startPauseBtn = $('btn-start-pause');
      els.resetBtn = $('btn-reset');
      els.skipBtn = $('btn-skip');
      els.memoBox = $('memo-box');
      els.memoInput = $('memo-input');
      els.memoSubmit = $('btn-memo-submit');
      els.memoSkip = $('btn-memo-skip');
      els.focusInput = $('set-focus');
      els.shortInput = $('set-short');
      els.longInput = $('set-long');
      els.settingsSave = $('btn-settings-save');
      els.settingsError = $('settings-error');
      els.logDate = $('log-date');
      els.logCount = $('log-count');
      els.logList = $('log-list');
    }

    function wire() {
      els.startPauseBtn.addEventListener('click', onStartPause);
      els.resetBtn.addEventListener('click', onReset);
      els.skipBtn.addEventListener('click', onSkip);
      els.memoSubmit.addEventListener('click', onMemoSubmit);
      els.memoSkip.addEventListener('click', onMemoSkip);
      els.settingsSave.addEventListener('click', onSettingsSave);
      els.navTimer.addEventListener('click', function () { view = 'timer'; render(); });
      els.navSettings.addEventListener('click', function () { view = 'settings'; render(); });
      els.navLog.addEventListener('click', function () { view = 'log'; logViewDate = Core.dateKey(now()); render(); });
      els.logDate.addEventListener('change', function () { logViewDate = els.logDate.value; render(); });
      doc.addEventListener('visibilitychange', onVisibilityChange);
      win.addEventListener('focus', function () { beeper.unlock(); });
      store.subscribe(function () { renderBanner(); });
    }

    function start() {
      cacheEls();
      if (!els.root) throw new Error('App root (#app) not found');
      loadPersisted();
      wire();
      if (notificationSupported(win) && win.Notification.permission === 'default') {
        requestNotificationPermission(win);
      }
      render();
      tickHandle = win.setInterval(tick, TICK_MS);
      return controller;
    }

    function stop() {
      if (tickHandle !== null) {
        win.clearInterval(tickHandle);
        tickHandle = null;
      }
    }

    var controller = {
      start: start,
      stop: stop,
      render: render,
      evaluate: evaluate,
      // 테스트/디버그용 접근자
      getState: function () {
        return {
          settings: Core.cloneSettings(settings),
          logs: logs,
          timer: Core.copyTimer(timer),
          view: view,
          storeState: store.getState()
        };
      },
      _internals: {
        onStartPause: onStartPause,
        onReset: onReset,
        onSkip: onSkip,
        submitMemo: submitMemo,
        onSettingsSave: onSettingsSave,
        onVisibilityChange: onVisibilityChange,
        fireNotification: fireNotification
      }
    };

    return controller;
  }

  return {
    createApp: createApp,
    createBeeper: createBeeper,
    formatClock: formatClock,
    sessionLabel: sessionLabel,
    notificationSupported: notificationSupported,
    notificationGranted: notificationGranted,
    requestNotificationPermission: requestNotificationPermission
  };
});

  /* ==== 부트스트랩 ==== */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
  function boot() {
    try { window.PomodoroApp.createApp({}).start(); }
    catch (e) { console.error("앱 시작 실패", e); }
  }
})();
</script>
</body>
</html>
